name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies & build static bundle
        run: |
          bun install --frozen-lockfile || bun install
          bun run build:spck
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r spck/* android/app/src/main/assets/www/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: android
        run: |
          if command -v gradle >/dev/null 2>&1; then
            GRADLE_BIN="gradle"
          else
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
            unzip -q -o /tmp/gradle.zip -d /tmp/gradle-dist
            GRADLE_BIN="/tmp/gradle-dist/gradle-8.10.2/bin/gradle"
          fi
          "$GRADLE_BIN" assembleDebug --no-daemon --stacktrace

      - name: Verify & Rename APK for download
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/NAIJA-RUN.apk
          ls -lh release-apk/NAIJA-RUN.apk
          APKSIGNER=$(command -v apksigner || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-apk/NAIJA-RUN.apk
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAIJA-RUN-APK
          path: release-apk/NAIJA-RUN.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: NAIJA RUN (Android APK)
          body: |
            Automated Android APK build of NAIJA RUN.
            Tap **NAIJA-RUN.apk** under Assets below on your Android phone to download and install directly.
            (Note: If you download from Actions Artifacts instead of Releases, extract `NAIJA-RUN-APK.zip` first to get `NAIJA-RUN.apk`.)
          files: release-apk/NAIJA-RUN.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
